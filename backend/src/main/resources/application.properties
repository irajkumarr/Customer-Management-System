spring.application.name=backend

# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_management_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session & Cookie configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000}

# Initial Admin credentials for seeding
app.admin.initial-username=${ADMIN_INITIAL_USERNAME:admin}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@123456}

# Google Gemini / Spring AI configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-key-for-dev}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-1.5-pro}
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=768

# PgVector Vector Store configuration
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=knowledge_vectors
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# RAG & AI Thresholds
app.ai.rag.top-k=3
app.ai.rag.similarity-threshold=0.65
app.ai.rag.knowledge-path=classpath:knowledge_base.md

# Mailgun configuration
app.mailgun.api-key=${MAILGUN_API_KEY:key-dummy}
app.mailgun.domain=${MAILGUN_DOMAIN:sandbox.mailgun.org}
app.mailgun.base-url=${MAILGUN_BASE_URL:https://api.mailgun.net}
app.mailgun.from-email=${MAILGUN_FROM_EMAIL:support@sandbox.mailgun.org}
app.mailgun.webhook-signing-key=${MAILGUN_WEBHOOK_SIGNING_KEY:}
