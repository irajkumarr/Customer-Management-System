spring.application.name=backend

# Datasource configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_management_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Session & Cookie configuration
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000}

# Initial Admin credentials for seeding
app.admin.initial-username=${ADMIN_INITIAL_USERNAME:admin}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:Admin@123456}

# Google Gemini / Spring AI configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-key-for-dev}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-1.5-pro}

# SendGrid configuration placeholders
app.sendgrid.api-key=${SENDGRID_API_KEY:SG.dummy}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:support@example.com}
app.sendgrid.webhook.public-key=${SENDGRID_WEBHOOK_PUBLIC_KEY:}
